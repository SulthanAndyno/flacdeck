name: Linux CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  lint-and-static-analysis:
    name: Lint (Ruff, Mypy, ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter & Formatter Check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Run Mypy Strict Type Checking
        run: uv run mypy src tests

      - name: Run ShellCheck on Linux Scripts
        run: shellcheck scripts/*.sh packaging/deb/*.sh

  linux-test-suite:
    name: Pytest + Real FLAC & exFAT Sync Simulation
    runs-on: ubuntu-latest
    needs: lint-and-static-analysis
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Audio & Filesystem Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flac rsync udisks2 libnotify-bin

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Pytest with Real FLAC Encoding
        run: uv run pytest --cov=flacdeck --cov-report=term-missing

      - name: End-to-End CLI & rsync Simulation
        run: |
          mkdir -p /tmp/e2e/songs /tmp/e2e/library /tmp/e2e/sdcard/Music
          uv run flacdeck status --songs-dir /tmp/e2e/songs --library-dir /tmp/e2e/library
          uv run flacdeck doctor --songs-dir /tmp/e2e/songs
          uv run flacdeck sdcard --library-dir /tmp/e2e/library --mount /tmp/e2e/sdcard --dry-run
