[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flacdeck"
version = "2.0.0"
description = "Linux-native CLI toolkit to fetch synced lyrics, organize FLAC libraries, and safely sync/unmount exFAT/FAT32 SD cards."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SulthanAndyno" }
]
keywords = ["linux", "flac", "lrc", "sdcard", "rsync", "udisksctl", "systemd", "audio"]
dependencies = [
    "mutagen>=1.47.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.31.0",
]

[project.scripts]
flacdeck = "flacdeck.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/flacdeck"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-requests>=2.31.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
